# AI assisted development
name: CD - Deploy to VPS

on:
  workflow_run:
    workflows: ["Full CI Pipeline"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_backend:
        description: 'Deploy Backend'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend'
        required: true
        default: true
        type: boolean

env:
  BACKEND_PATH: /opt/medexjob/backend
  FRONTEND_PATH: /var/www/medexjob
  SERVICE_NAME: medexjob-backend

jobs:
  pre-deploy:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Check deployment conditions
        id: check
        run: |
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Pre-deployment checks passed"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: ${{ needs.pre-deploy.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_backend == 'true') }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://medexjob.com/api
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p ./artifacts/backend

      - name: Download backend artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./artifacts/backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify artifact exists
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G './artifacts/backend/*.jar' > /dev/null; then
            echo "Backend JAR found"
            echo "jar_exists=true" >> "$GITHUB_OUTPUT"
            ls -lh ./artifacts/backend/
          else
            echo "No backend artifact found. Building from source."
            echo "jar_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.verify.outputs.jar_exists == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        if: steps.verify.outputs.jar_exists == 'false'
        working-directory: backend
        run: |
          set -euo pipefail
          mvn clean package -DskipTests
          mkdir -p ../artifacts/backend
          cp target/*.jar ../artifacts/backend/

      - name: Validate and connect to VPS
        id: ssh_setup
        shell: bash
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret $name is missing or empty."
              exit 1
            fi
          done

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then
            echo "::error::VPS_PORT must be a valid TCP port."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid unencrypted private SSH key."
            exit 1
          fi

          echo "Checking SSH network reachability to configured VPS port..."
          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_PORT}" 2>/dev/null; then
            echo "::error::GitHub runner cannot reach VPS_HOST on VPS_PORT. Check VPS_HOST/VPS_PORT, VPS firewall/security group, SSH service, and any source-IP allowlist."
            exit 1
          fi

          echo "Checking SSH authentication..."
          if ! ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'echo SSH connection verified'; then
            echo "::error::VPS is reachable, but SSH authentication failed. Check VPS_USER, VPS_SSH_KEY, and authorized_keys on the server."
            exit 1
          fi

          echo "ssh_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create backup on server
        id: backup
        run: |
          set -euo pipefail
          ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            sudo mkdir -p /opt/medexjob/backend/backups

            if [ -f /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar ]; then
              BACKUP_NAME="medexjob-backend-$(date +%Y%m%d-%H%M%S).jar"
              sudo cp /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar /opt/medexjob/backend/backups/$BACKUP_NAME
              echo "Backup created: $BACKUP_NAME"
              cd /opt/medexjob/backend/backups
              ls -t *.jar 2>/dev/null | tail -n +6 | xargs -r sudo rm --
            else
              echo "No existing backend JAR found; nothing to back up."
            fi
          EOF

      - name: Deploy Backend JAR
        run: |
          set -euo pipefail
          JAR_PATH=$(find ./artifacts/backend -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No deployable backend JAR found."
            exit 1
          fi

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$JAR_PATH" \
            "$VPS_USER@$VPS_HOST:/tmp/medexjob-backend-1.0.0.jar"

          ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            sudo mkdir -p /opt/medexjob/backend/target
            sudo mv /tmp/medexjob-backend-1.0.0.jar /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar
            sudo chown root:root /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar
            sudo chmod 755 /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar
            sudo systemctl restart medexjob-backend
            sleep 5
            sudo systemctl is-active --quiet medexjob-backend
            echo "Backend service restarted successfully."
          EOF

      - name: Backend deployment result
        run: echo "Backend deployment completed successfully."

      - name: Rollback backend on deployment failure
        if: ${{ failure() && steps.ssh_setup.outputs.ssh_ready == 'true' && steps.backup.outcome == 'success' }}
        run: |
          ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            echo "Rolling back backend to previous version..."
            LATEST_BACKUP=$(ls -t /opt/medexjob/backend/backups/*.jar 2>/dev/null | head -1 || true)
            if [ -n "$LATEST_BACKUP" ]; then
              sudo cp "$LATEST_BACKUP" /opt/medexjob/backend/target/medexjob-backend-1.0.0.jar
              sudo systemctl restart medexjob-backend
              sudo systemctl is-active --quiet medexjob-backend
              echo "Rollback completed."
            else
              echo "No backend backup is available for rollback."
            fi
          EOF

      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: ${{ needs.pre-deploy.outputs.should_deploy == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_frontend == 'true') }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://medexjob.com
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifacts directory
        run: mkdir -p ./artifacts/frontend

      - name: Download frontend artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./artifacts/frontend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify artifact exists
        id: verify
        run: |
          set -euo pipefail
          if [ -d ./artifacts/frontend ] && [ -n "$(ls -A ./artifacts/frontend 2>/dev/null)" ]; then
            echo "Frontend build found"
            echo "build_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend artifact found. Building from source."
            echo "build_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.verify.outputs.build_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        if: steps.verify.outputs.build_exists == 'false'
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p ../artifacts/frontend
          cp -r dist/. ../artifacts/frontend/

      - name: Validate and connect to VPS
        id: ssh_setup
        shell: bash
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret $name is missing or empty."
              exit 1
            fi
          done

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || [ "$VPS_PORT" -lt 1 ] || [ "$VPS_PORT" -gt 65535 ]; then
            echo "::error::VPS_PORT must be a valid TCP port."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid unencrypted private SSH key."
            exit 1
          fi

          echo "Checking SSH network reachability to configured VPS port..."
          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${VPS_PORT}" 2>/dev/null; then
            echo "::error::GitHub runner cannot reach VPS_HOST on VPS_PORT. Check VPS_HOST/VPS_PORT, VPS firewall/security group, SSH service, and any source-IP allowlist."
            exit 1
          fi

          echo "Checking SSH authentication..."
          if ! ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'echo SSH connection verified'; then
            echo "::error::VPS is reachable, but SSH authentication failed. Check VPS_USER, VPS_SSH_KEY, and authorized_keys on the server."
            exit 1
          fi

          echo "ssh_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create backup on server
        run: |
          set -euo pipefail
          ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            sudo mkdir -p /var/www/backups
            if [ -d /var/www/medexjob ] && [ -n "$(ls -A /var/www/medexjob 2>/dev/null)" ]; then
              BACKUP_NAME="frontend-$(date +%Y%m%d-%H%M%S)"
              sudo tar -czf /var/www/backups/$BACKUP_NAME.tar.gz -C /var/www/medexjob .
              echo "Backup created: $BACKUP_NAME.tar.gz"
              cd /var/www/backups
              ls -t frontend-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r sudo rm --
            else
              echo "No existing frontend found; nothing to back up."
            fi
          EOF

      - name: Deploy Frontend
        run: |
          set -euo pipefail
          tar -czf /tmp/frontend-build.tar.gz -C artifacts/frontend .

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            /tmp/frontend-build.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/frontend-build.tar.gz"

          ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            sudo mkdir -p /var/www/medexjob
            sudo find /var/www/medexjob -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            sudo tar -xzf /tmp/frontend-build.tar.gz -C /var/www/medexjob
            sudo chown -R www-data:www-data /var/www/medexjob
            sudo chmod -R u=rwX,go=rX /var/www/medexjob
            rm -f /tmp/frontend-build.tar.gz
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Frontend deployed and Nginx reloaded successfully."
          EOF

      - name: Frontend Health Check
        run: |
          set -euo pipefail
          sleep 5
          HTTP_STATUS=$(curl --connect-timeout 10 --max-time 20 -s -o /dev/null -w '%{http_code}' https://medexjob.com || true)
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "Frontend is accessible (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Frontend health check returned HTTP ${HTTP_STATUS:-000}."
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | ${{ needs.deploy-backend.result == 'success' && 'Success' || needs.deploy-backend.result == 'skipped' && 'Skipped' || 'Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${{ needs.deploy-frontend.result == 'success' && 'Success' || needs.deploy-frontend.result == 'skipped' && 'Skipped' || 'Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: ${{ github.event.inputs.environment || 'production' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
